<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            padding: 5rem;
        }
        .container h1{
            font-size: 20px;
            font-weight: 200;
        }
        .container ul{
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: -40px;
        }
        .container ul li{
            list-style-type: none;
            font-size: 20px;
            font-weight: 200;
            padding-left: 20px;
        }
        caption{
            font-size: 20px;
            text-align: left;
            margin-bottom: 10px;
            font-weight: 200;
        }
        table{
            border-collapse: collapse;
            width: 800px;
            height: 300px;
            padding: 50px 20px 20px 30px;
            /* margin: 50px 80px 50px 40px; */
        }
        table, th, td {
            padding: 13px;
            border: 2px solid black;
            text-align: center;
            font-size: 20px;
        }
        div{
            font-size: 20px;
            font-weight: 200;
            margin-top: 25px;
        }

        
/* Mobile screen */
@media screen and (max-width: 480px) {
    body {
        padding: 15px;
        margin: 0;
    }

    .container h1 {
        font-size: 17px;
        line-height: 1.5;
    }

    .container ul {
        gap: 12px;
        padding: 0;
        flex-wrap: wrap;
    }

    .container ul li {
        font-size: 14px;
    }

    caption {
        font-size: 16px;
        margin-bottom: 8px;
    }

    table {
        width: 100%;
        height: auto;
    }

    table, th, td {
        font-size: 13px;
        padding: 8px 5px;
    }

    div {
        font-size: 15px;
        line-height: 1.6;
    }
}

    
    </style>
</head>
<body>
    <main>
        <div class="container">
            <h1>Acme Plans</h1>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </div>
    </main>

    <main>
        <table>
            <caption>Plan Comparison</caption>
            <tr>
                <td>Plan</td>
                <td>Storage</td>
                <td>Projects</td>
                <td>Support</td>
            </tr>
            <tr>
                <td>Free</td>
                <td>5 GB</td>
                <td>3</td>
                <td>Email</td>
            </tr>
            <tr>
                <td>Pro</td>
                <td>100 GB</td>
                <td>25</td>
                <td>Priority Email</td>
            </tr>
            <tr>
                <td>Business</td>
                <td>1 TB</td>
                <td>Unlimited</td>
                <td>24/7 Phone</td>
            </tr>
            <tr>
                <td colspan="4">All plans include SSL and daily backups</td>
            </tr>
        </table>
    </main>
    <div>
        &copy; 2025 MySite
    </div>

</body>
</html>
